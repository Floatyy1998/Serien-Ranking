name: iOS TestFlight

# Manuell ausloesen (Actions-Tab -> iOS TestFlight -> Run workflow).
# Die Huelle laedt die Live-Site — ein neuer iOS-Build ist nur noetig,
# wenn sich Natives aendert (Capacitor-Config, Plugins, Icons).
# Laeuft auf dem xcode-27-Image (macOS 27, Xcode 27.1 als Default): erst das 27.1-SDK
# fuellt das iPhone-Duo-Innendisplay statt Letterboxing; Capacitor 8.5 verlangt dafuer UIScene.
on:
  workflow_dispatch:
    inputs:
      duo_only:
        description: 'Nur Duo-Simulator-Screenshots, kein TestFlight-Upload'
        type: boolean
        default: false

jobs:
  build-upload:
    if: ${{ !inputs.duo_only }}
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v5

      - name: Xcode 27.1 oder neuer waehlen
        run: |
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          fi
          xcodebuild -version
          v=$(xcodebuild -version | awk 'NR==1 {print $2}')
          case "$v" in
            27.0*|2[0-6].*) echo "Xcode $v ist zu alt, 27.1+ noetig"; exit 1 ;;
          esac

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Capacitor sync (ios)
        run: npx cap sync ios

      - name: App Store Connect API key ablegen
        env:
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPSTORE_P8" > ~/private_keys/AuthKey.p8

      - name: Build + Upload via fastlane
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_P8_PATH: /Users/runner/private_keys/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          # xcodebuild -showBuildSettings braucht auf kalten Runnern (SPM-
          # Aufloesung) laenger als das 3s-Default — sonst flakt build_app.
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '180'
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: '6'
        run: fastlane ios beta

      - name: IPA + Zertifikate als Artifact sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-rank-ios
          path: |
            build/ipa/*.ipa
            build/certs/*
          retention-days: 5

  # Nur zum Anschauen: Screenshots aus dem iPhone-Duo-Simulator, weil kein Geraet
  # vorhanden ist. Darf scheitern, ohne den TestFlight-Upload zu blockieren.
  duo-simulator:
    runs-on: xcode-27
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Capacitor sync (ios)
        run: npx cap sync ios

      - name: Xcode 27.1 oder neuer waehlen
        run: |
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          fi
          xcodebuild -version

      - name: Simulator-Build ohne Signierung
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          -quiet build

      - name: iPhone Duo starten und fotografieren
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | .value[] | select(.name | test("Duo")) | .udid' | head -1)
          if [ -z "$udid" ]; then
            echo "Kein iPhone-Duo-Simulator auf diesem Image:"
            xcrun simctl list devices available | head -60
            exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          app=$(find build/sim/Build/Products -maxdepth 2 -name App.app | head -1)
          xcrun simctl install "$udid" "$app"
          mkdir -p build/duo-shots
          xcrun simctl launch "$udid" de.tvrank.app
          sleep 45
          # Zwei Displays (1 = aussen, 3 = innen); ohne --display verweigert simctl. Das abgeschaltete liefert Schwarz.
          shot() { xcrun simctl io "$udid" screenshot --display="$2" "build/duo-shots/$1-display-$2.png" 2>/dev/null || true; }
          for d in 1 2 3 4; do shot closed "$d"; done
          # Aufklappen kennt simctl nicht; hinge (Community-Tool, privates Protokoll) setzt den Scharnierwinkel.
          if brew install artemnovichkov/tap/hinge >/dev/null 2>&1 && hinge open -d "$udid"; then
            sleep 6
            hinge posture -d "$udid" || true
            for d in 1 2 3 4; do shot open "$d"; done
            if hinge rotate left -d "$udid"; then
              sleep 6
              for d in 1 2 3 4; do shot open-landscape "$d"; done
            fi
          else
            echo "hinge nicht verfuegbar, nur zugeklappte Screenshots"
          fi
          ls -la build/duo-shots

      - name: Duo-Screenshots als Artifact sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-duo-screenshots
          path: build/duo-shots/*.png
          retention-days: 14
