name: CVE-Prüfung

# Täglich npm audit für App und Cloud Function. Neue kritische/hohe Funde
# meldet scripts/security-audit.cjs per Glocke + Push an den Admin.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      testmeldung:
        description: 'Testmeldung an den Admin schicken (auch ohne Funde)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: firebase-admin für die Meldung
        working-directory: functions
        # @firebase/app ist ein optionaler Peer von firebase-admin/database und fehlt sonst.
        run: |
          npm ci --omit=dev --ignore-scripts --loglevel=error
          npm install --no-save --ignore-scripts --loglevel=error @firebase/app

      - name: Prüfen und melden
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          # Admin-SDK-Dienstkonto (Datenbank-Recht); das Deploy-Konto darf nur Hosting.
          SA_KEY: ${{ secrets.FIREBASE_ADMIN_SA }}
          AUDIT_TEST: ${{ inputs.testmeldung && '1' || '' }}
        run: |
          printf '%s' "$SA_KEY" > /tmp/sa-key.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json node scripts/security-audit.cjs
